[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freshstock"
version = "0.1.0"
description = "Demand forecasting and inventory planning for small food retailers"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=17,<24",
  "scikit-learn>=1.5,<2",
  "lightgbm>=4.5,<5",
  "joblib>=1.4,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
freshstock = "freshstock.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/freshstock"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
